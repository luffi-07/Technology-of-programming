<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Калькулятор скидки</title><link rel="stylesheet" href="./styles/style.css"></head>
<body><main class="card"><h1>Калькулятор скидки</h1><p>Введите цену товара и размер скидки.</p>
<label>Цена товара (₸)<input id="price" type="number" min="0" step="0.01" placeholder="Например, 15000"></label>
<label>Скидка (%)<input id="discount" type="number" min="0" max="100" step="0.1" placeholder="Например, 15"></label>
<button id="calculate">Рассчитать</button><p id="result" class="result" aria-live="polite"></p></main><script type="module" src="./src/main.js"></script></body></html>
