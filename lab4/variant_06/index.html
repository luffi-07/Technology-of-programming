<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 6 — Подписка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Подписка на новости</h1>
  <form id="subForm" novalidate>
    <div class="field" data-field="name">
      <label for="name">Имя</label>
      <input id="name" type="text">
      <span class="error"></span>
    </div>
    <div class="field" data-field="email">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="name@example.com">
      <span class="error"></span>
    </div>
    <fieldset class="field" data-field="topics">
      <legend>Интересующие темы</legend>
      <button type="button" class="link-btn" id="toggleAll">Выбрать все</button>
      <label class="opt"><input type="checkbox" name="topic" value="Программирование"> Программирование</label>
      <label class="opt"><input type="checkbox" name="topic" value="Дизайн"> Дизайн</label>
      <label class="opt"><input type="checkbox" name="topic" value="Наука"> Наука</label>
      <label class="opt"><input type="checkbox" name="topic" value="Карьера"> Карьера</label>
      <span class="hint" id="topicCount">Выбрано тем: 0</span>
      <span class="error"></span>
    </fieldset>
    <button type="submit">Подписаться</button>
  </form>
  <div id="result" class="result"></div>
</main>
<script src="script.js"></script>
</body>
</html>
