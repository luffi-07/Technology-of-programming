<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 6 — Сумма от 1 до N</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
    input, button { padding: 10px; margin: 5px 0; }
    #result { margin-top: 20px; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Список чисел от 1 до N</h1>
  <label for="number">Введите N:</label><br>
  <input id="number" type="number" min="1" placeholder="Например, 10">
  <button id="calculate">Рассчитать</button>
  <button id="clear">Очистить</button>
  <div id="result"></div>
  <script src="script.js"></script>
</body>
