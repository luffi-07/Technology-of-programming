<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 8: поиск по публикациям</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Публикации с поиском по заголовку</h1>
  <div class="toolbar">
    <button id="load">Загрузить публикации</button>
    <button id="retry" class="secondary hidden">Повторить</button>
    <input id="search" type="search" placeholder="Поиск по заголовку..." disabled>
  </div>
  <p id="status" role="status"></p>
  <p id="stats" class="stats"></p>
  <ul id="results"></ul>
</body>
</html>
