<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 11: комментарии к публикации</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Комментарии к публикации (/posts/{id}/comments)</h1>
  <form id="form" class="toolbar">
    <label for="post-id">ID публикации:</label>
    <input id="post-id" type="number" min="1" step="1" value="1" required>
    <button id="load" type="submit">Показать</button>
    <button id="retry" type="button" class="secondary hidden">Повторить</button>
  </form>
  <p id="status" role="status"></p>
  <p id="stats" class="stats"></p>
  <ul id="results"></ul>
</body>
</html>
