<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет личных расходов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 22px;
        }
        .balance-card {
            background: #3498db;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #27ae60;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            padding: 10px;
            background: #f9f9f9;
            border-left: 5px solid #ccc;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        li.income {
            border-left-color: #2ecc71;
        }
        li.expense {
            border-left-color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Учет личных расходов</h1>
    
    <div class="balance-card">
        Баланс: <span id="balance">0</span> тг
    </div>

    <div class="form-group">
        <label for="type">Тип операции:</label>
        <select id="type">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select>
    </div>

    <div class="form-group">
        <label for="category">Категория:</label>
        <input type="text" id="category" placeholder="Например: Еда, Зарплата">
    </div>

    <div class="form-group">
        <label for="amount">Сумма (тг):</label>
        <input type="number" id="amount" placeholder="Введите сумму">
    </div>

    <button onclick="addTransaction()">Добавить запись</button>

    <h3>История операций:</h3>
    <ul id="transactionList"></ul>
</div>

<script>
    let transactions = [];
    let balance = 0;

    function addTransaction() {
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value.trim();
        const amountInput = document.getElementById('amount').value;
        const amount = parseFloat(amountInput);

        if (!category || isNaN(amount) || amount <= 0) {
            alert('Пожалуйста, заполните корректно все поля!');
            return;
        }

        if (type === 'income') {
            balance += amount;
        } else {
            balance -= amount;
        }

        transactions.push({ type, category, amount });
        
        document.getElementById('category').value = '';
        document.getElementById('amount').value = '';

        updateUI();
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance;
        const list = document.getElementById('transactionList');
        list.innerHTML = '';

        transactions.forEach(t => {
            const li = document.createElement('li');
            li.className = t.type;
            const sign = t.type === 'income' ? '+' : '-';
            li.innerHTML = `<span><b>${t.category}</b></span> <span>${sign}${t.amount} тг</span>`;
            list.appendChild(li);
        });
    }
</script>

</body>
</html>
