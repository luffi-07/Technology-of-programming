<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Счетчик</h1>
        <div id="value">0</div>
        <div class="buttons">
            <button id="minus">−</button>
            <button id="reset">Сброс</button>
            <button id="plus">+</button>
        </div>
        <p id="message">Можно изменять значение кнопками.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
