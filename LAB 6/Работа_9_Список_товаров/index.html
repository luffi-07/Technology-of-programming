<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список товаров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Интерактивный список товаров</h1>
        <div class="add">
            <input id="nameInput" placeholder="Название товара">
            <input id="priceInput" type="number" min="0" placeholder="Цена">
            <button id="addBtn">Добавить</button>
        </div>
        <div id="products"></div>
        <h2>Итого: <span id="total">0</span> ₸</h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
