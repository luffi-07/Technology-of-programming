<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ-аккордеон</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Часто задаваемые вопросы</h1>

        <div class="faq">
            <button class="question">Что такое DOM?</button>
            <div class="answer">DOM — это объектная модель HTML-документа, которой можно управлять через JavaScript.</div>
        </div>

        <div class="faq">
            <button class="question">Что делает addEventListener?</button>
            <div class="answer">Он позволяет назначить обработчик, который будет реагировать на событие пользователя.</div>
        </div>

        <div class="faq">
            <button class="question">Что такое querySelector?</button>
            <div class="answer">Метод querySelector находит первый элемент страницы, соответствующий CSS-селектору.</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
