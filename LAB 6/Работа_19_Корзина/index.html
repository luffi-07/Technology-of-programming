<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина магазина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Корзина интернет-магазина</h1>
        <div id="cart"></div>
        <div class="summary">
            <p>Количество товаров: <b id="itemsCount">0</b></p>
            <p>Общая сумма: <b id="total">0</b> ₸</p>
        </div>
        <button id="clearBtn">Очистить корзину</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
