<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог фильмов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 id="title">Каталог фильмов</h1>
<form id="form">
  <input id="movieTitle" placeholder="Название" autocomplete="off">
  <input id="genre" placeholder="Жанр" autocomplete="off">
  <input id="rating" type="number" min="1" max="10" step="0.1" placeholder="Рейтинг (1–10)">
  <button type="submit">Добавить</button>
</form>
<p class="error" id="error" role="alert"></p>
<div class="row">
  <label for="filter">Фильтр по жанру:</label>
  <select id="filter"><option value="">Все жанры</option></select>
</div>
<ul id="list"></ul>
</main>
<script src="app.js" defer></script>
</body>
</html>
