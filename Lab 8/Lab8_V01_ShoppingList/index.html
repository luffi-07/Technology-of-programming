<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список покупок</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 id="title">Список покупок</h1>
<form id="form">
  <input id="item" placeholder="Название товара" autocomplete="off">
  <button type="submit">Добавить</button>
  <button type="button" id="clear" class="danger">Очистить список</button>
</form>
<p class="error" id="error" role="alert"></p>
<ul id="list"></ul>
</main>
<script src="app.js" defer></script>
</body>
</html>
