<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки темы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 id="title">Настройки темы</h1>
<div class="row">
  <label for="theme">Тема:</label>
  <select id="theme">
    <option value="light">Светлая</option>
    <option value="dark">Тёмная</option>
  </select>
</div>
<div class="row">
  <label for="size">Размер текста:</label>
  <input id="size" type="range" min="12" max="28" step="1">
  <output id="sizeOut"></output>
</div>
<button id="reset" class="ghost">Сбросить настройки</button>
<p class="error" id="error" role="alert"></p>
<p>Этот текст показывает выбранный размер. Настройки сохраняются в localStorage и применяются при следующем открытии страницы.</p>
</main>
<script src="app.js" defer></script>
</body>
</html>
