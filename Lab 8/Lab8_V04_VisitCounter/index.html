<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Счётчик посещений</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 id="title">Счётчик посещений</h1>
<p class="muted">Число открытий страницы</p>
<div class="big" id="count">0</div>
<p id="last"></p>
<p id="session"></p>
<p class="error" id="error" role="alert"></p>
<button id="reset" class="danger">Сбросить счётчик</button>
</main>
<script src="app.js" defer></script>
</body>
</html>
